name: JoshHack Quality Checks

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    defaults:
      run:
        working-directory: JoshHack

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: JoshHack/pom.xml

      - name: Run JUnit regression tests
        run: |
          chmod +x mvnw
          ./mvnw test

      - name: Run PIT mutation testing
        run: ./mvnw test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Run SpotBugs static analysis
        run: ./mvnw spotbugs:spotbugs

      - name: Upload SpotBugs SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: JoshHack/target/spotbugs.sarif
          category: spotbugs

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4 
        with:
          name: pit-report
          path: JoshHack/target/pit-reports/